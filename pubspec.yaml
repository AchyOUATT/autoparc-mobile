name: auto
description: "AutoParc – vente et location de véhicules, pièces et accessoires."
publish_to: 'none'
version: 1.5.2+1

environment:
  sdk: ^3.11.5
  # Version de Flutter du projet. Les workflows la lisent ici plutôt que de la
  # réécrire chacun de leur côté : les deux avaient divergé, et celui des tests
  # est resté sur Flutter 3.32 — Dart 3.8, trop ancien pour le SDK exigé
  # ci-dessus. `flutter pub get` échouait, et les tests ne tournaient plus.
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter

  # Les délégués traduits de Material, Cupertino et Widgets, et les données de
  # locale sans lesquelles `MaterialApp` ne sait servir que l'anglais.
  #
  # VIENT DU SDK, et c'est la seule raison pour laquelle ce lot se permet une
  # ligne de plus ici : il n'y a aucune contrainte de version à négocier. Le
  # dépôt a déjà payé une résolution bloquée — share_plus 13 exige `win32 ^6`
  # quand package_info_plus 8 reste sur `win32 ^5.5.3`, voir plus bas —, donc
  # la traduction se fait sans aucune dépendance tierce : ni paquet de
  # détection de langue, ni surcouche d'ARB.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP
  dio: ^5.7.0

  # Firebase (auth client mobile + push notifications)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Connexion Google native. Firebase seul ne suffit pas sur Android :
  # `signInWithProvider` y ouvre un onglet Chrome — le flux prévu pour les
  # fournisseurs OAuth génériques, pas celui que Google documente pour mobile.
  # Android tuait le processus pendant l'onglet, et la Future mourait avec lui.
  google_sign_in: ^7.2.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation déclarative
  go_router: ^14.6.2

  # Token Sanctum stocké de façon sécurisée (staff)
  flutter_secure_storage: ^9.2.2

  # Cache catalogue local (SQLite)
  sqflite: ^2.4.0
  path: ^1.9.1

  # Images réseau avec cache
  cached_network_image: ^3.4.1
  # `flutter_cache_manager` était déclaré ici, à côté, pour un seul appelant :
  # le partage ouvrait `DefaultCacheManager` en direct afin de joindre la photo
  # déjà en cache. Le partage envoie maintenant l'adresse de la page publique
  # et aucun fichier — une image jointe empêche WhatsApp de rendre l'aperçu de
  # lien —, plus rien ne l'importe (vérifié par grep sur lib/, test/, tool/),
  # et une dépendance directe sans appelant finit par être montée de version
  # pour personne. Elle reste disponible en transitif de
  # cached_network_image ; la redéclarer sera nécessaire le jour où du code la
  # réimportera, sous peine de `depend_on_referenced_packages`.

  # Logos de marques : les sources publiques les distribuent en SVG, qui reste
  # net à toutes les tailles. À retirer si l'on repasse à des PNG.
  flutter_svg: ^2.0.10

  # Formatage (dates, monnaie XOF).
  #
  # PLANCHER MONTÉ À 0.20.3 PAR LE SDK, ET NON PAR CHOIX. Le lot de traduction
  # déclare `flutter_localizations`, qui vient du SDK et dont la contrainte est
  # `intl ^0.20.3` : `flutter pub get` refusait net —
  #
  #   Because auto depends on flutter_localizations from sdk which depends on
  #   intl ^0.20.3, intl ^0.20.3 is required.
  #   So, because auto depends on intl ^0.19.0, version solving failed.
  #
  # Il n'y a donc aucune marge ici tant que `flutter_localizations` est
  # déclaré. Ce n'est PAS une dépendance de plus, c'est un plancher que le SDK
  # impose sur une dépendance déjà présente.
  #
  # LA MONTÉE A ÉTÉ MESURÉE, et non supposée, parce que les séparateurs de
  # milliers sont assertés au caractère près dans les bancs — « 95 000 km »
  # porte une espace fine insécable U+202F dans vehicle_card_test.dart. Lu
  # sous 0.20.3 : `NumberFormat.currency(locale: fr_FR)` rend toujours U+202F
  # entre les milliers et U+00A0 devant FCFA, `decimalPattern(fr_FR)` toujours
  # U+202F. Aucun des 595 tests ne bouge.
  intl: ^0.20.3

  # Equals/hashCode sans boilerplate
  equatable: ^2.0.7

  # Liens externes (WhatsApp, téléphone)
  url_launcher: ^6.3.1

  # Feuille de partage du système (WhatsApp, Facebook, Messenger, SMS…).
  #
  # Bloqué sur la branche 12 : à partir de 13.0.0, share_plus exige
  # `win32 ^6`, alors que `package_info_plus ^8` — indispensable au plancher
  # de version ci-dessous — reste sur `win32 ^5.5.3`. La résolution échoue.
  # Monter de branche suppose donc de monter package_info_plus d'abord.
  share_plus: ^12.0.2

  # Sélection de photos depuis la galerie ou l'appareil photo
  image_picker: ^1.1.2
  # Déclarés explicitement pour activer le sélecteur de photos du système
  # (voir main.dart) : sans lui, l'application devait réclamer
  # READ_MEDIA_IMAGES, que Google Play refuse depuis Android 13.
  #
  # PLANCHER MONTÉ À +25 pour une raison de mémoire, pas de confort.
  # pubspec.lock tenait 0.8.13+17, dont l'`ImageResizer.java` construit un
  # `BitmapFactory.Options` NEUF puis lit `outWidth`/`outHeight` dessus pour
  # calculer `inSampleSize` : ces champs valent zéro, le test de réduction est
  # toujours faux, et BitmapFactory décodait à PLEINE RESOLUTION avant de
  # réduire. Une prise de 4000x3000 fait 48,0 Mo en ARGB_8888, plus 12,6 Mo
  # pour la copie réduite allouée pendant que la source vit encore — 60,6 Mo
  # de pointe. Or `minSdk` vaut 24, et jusqu'à l'API 25 les pixels d'un Bitmap
  # vivent sur le tas Java, dont le défaut AOSP est 48 Mo sur un appareil de
  # 512 Mo de RAM et 96 Mo sur un appareil de 1 Go : le décodage seul dépassait
  # le premier.
  #
  # +25 corrige exactement cela (« large images are now subsampled while
  # decoding ») : la taille d'origine, lue par `readFileDimensions` avec
  # `inJustDecodeBounds`, est passée à `calculateSampleSize` en entiers. Lu
  # dans la source installée, pas déduit du journal des modifications.
  #
  # La résolution a été vérifiée avant d'être posée, parce que ce dépôt a déjà
  # payé un blocage (share_plus 13 contre package_info_plus 8, ci-dessus) :
  # `flutter pub upgrade image_picker_android --dry-run` annonce « Would change
  # 1 dependency ». Et comme +18 migre le greffon vers le Kotlin intégré d'AGP,
  # la construction Android a été mesurée pour de vrai, pas supposée :
  # `flutter build apk --debug` puis `--release` (R8 et shrinkResources
  # compris) passent tous deux.
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.1

  # Persistance légère (onboarding vu, préférences UI)
  shared_preferences: ^2.3.2

  # Lecture du versionCode réellement installé, pour le plancher de version
  # servi par l'API (voir core/update/version_minimale.dart).
  #
  # Une constante Dart ne pouvait pas faire l'affaire : le versionCode n'est
  # pas dans ce fichier à l'exécution. La CI le passe par `--build-number`, et
  # le `version:` ci-dessus n'est que le repli quand personne ne le fournit.
  # Seule la plateforme connaît donc le numéro embarqué dans l'APK — côté
  # Android il se lit dans le PackageManager, pas dans le code.
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.3.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Déclenche `gen-l10n` à chaque `flutter pub get`, d'après l10n.yaml. Sans
  # cette ligne, `lib/l10n/app_localizations.dart` ne serait régénéré que par un
  # appel manuel à `flutter gen-l10n`, et un `.arb` modifié sans cet appel
  # compilerait l'ancien texte en silence.
  generate: true

  assets:
    # Logos de marques, nommés sur le slug de la table `brands`
    # (bmw.svg, land-rover.svg…). Voir assets/brands/README.md.
    # Le dossier est déclaré même s'il est vide : l'appli se rabat
    # proprement sur l'icône générique tant qu'un fichier manque.
    - assets/brands/
