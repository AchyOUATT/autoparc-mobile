name: auto
description: "AutoParc – vente et location de véhicules, pièces et accessoires."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP
  dio: ^5.7.0

  # Firebase (auth client mobile + push notifications)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation déclarative
  go_router: ^14.6.2

  # Token Sanctum stocké de façon sécurisée (staff)
  flutter_secure_storage: ^9.2.2

  # Cache catalogue local (SQLite)
  sqflite: ^2.4.0
  path: ^1.9.1

  # Images réseau avec cache
  cached_network_image: ^3.4.1

  # Formatage (dates, monnaie XOF)
  intl: ^0.19.0

  # Equals/hashCode sans boilerplate
  equatable: ^2.0.7

  # Liens externes (WhatsApp, téléphone)
  url_launcher: ^6.3.1

  # Sélection de photos depuis la galerie ou l'appareil photo
  image_picker: ^1.1.2

  # Persistance légère (onboarding vu, préférences UI)
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
