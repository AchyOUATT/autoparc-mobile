name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:   # Permet de déclencher manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    # Le contexte `secrets` n'est pas lisible depuis le `if` d'une étape : on le
    # recopie ici, où il l'est, pour pouvoir construire même avant que la clé
    # n'existe.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # Lus directement par android/app/build.gradle.kts, et par l'épreuve de la
      # clé : la même source pour les deux.
      #
      # Ils étaient auparavant recopiés dans key.properties par un heredoc. Le
      # shell y développait `$` et exécutait les accents graves, puis
      # java.util.Properties avalait les antislashs : un mot de passe contenant
      # l'un de ces caractères arrivait faux chez Gradle, alors que l'épreuve,
      # qui lisait l'environnement, le trouvait juste. Le bundle échouait sur une
      # clé déclarée valide.
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Doit rester égale à celle du workflow « Tests ». Les deux ont déjà
      # divergé sans que rien ne le signale ; c'est la contrainte
      # `environment: flutter:` de pubspec.yaml qui rattrape le cas, en
      # faisant échouer `pub get` avec la version attendue en clair.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # Restaure google-services.json depuis les secrets GitHub
      - name: Restaurer google-services.json
        # Le secret passe par l'environnement, pas par le texte du script.
        # `echo '${{ secrets.… }}'` collait le JSON dans le script avant que
        # bash ne l'exécute : une apostrophe dans le contenu suffisait à le
        # casser. Le même défaut avait déjà déformé les mots de passe.
        #
        # Le fichier est ensuite vérifié : Gradle le rejette par « Malformed
        # root json » après plusieurs minutes de compilation, sans dire si le
        # secret est vide, tronqué ou d'un autre projet.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          fichier=android/app/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$fichier"
          echo "google-services.json : $(stat -c%s "$fichier") octets."

          if [ ! -s "$fichier" ]; then
            echo "::error::Le secret GOOGLE_SERVICES_JSON est vide."
            exit 1
          fi

          if ! python3 -m json.tool "$fichier" > /dev/null 2>&1; then
            echo "::error::Le secret GOOGLE_SERVICES_JSON n'est pas du JSON valide — probablement tronqué au copier-coller. Recoller le contenu complet de android/app/google-services.json."
            exit 1
          fi

          if ! grep -q '"package_name": *"bf.autoparc.app"' "$fichier"; then
            echo "::error::GOOGLE_SERVICES_JSON ne déclare pas le paquet bf.autoparc.app : c'est une ancienne version du fichier. Télécharger la version à jour depuis la console Firebase."
            exit 1
          fi

          echo "google-services.json valide, paquet bf.autoparc.app présent."

      # Clé de signature. Absente, le build reste possible — utile tant que la
      # clé n'existe pas — mais l'artefact est alors signé en debug, ce que
      # Google Play refuse. La vérification en fin de workflow le dit, plutôt
      # que de laisser découvrir le problème à l'envoi.
      #
      # Seul le fichier est écrit ici. Les mots de passe ne passent plus par un
      # fichier texte : voir le bloc `env` en tête du job.
      - name: Restaurer la clé de signature
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/autoparc-upload.jks
          echo "ANDROID_KEYSTORE_FILE=autoparc-upload.jks" >> "$GITHUB_ENV"

      # Éprouver la clé avant de bâtir, exactement comme Gradle le fera.
      #
      # Gradle échoue sur une clé illisible par un message qui ne nomme pas la
      # cause, et au bout de plusieurs minutes de compilation. Deux versions de
      # cette épreuve ont laissé passer l'échec :
      #
      #  • `keytool -list` n'utilise que le mot de passe du magasin. Dans un
      #    magasin PKCS12, un mot de passe de clé erroné l'ouvre sans difficulté
      #    et n'est refusé qu'à l'extraction de la clé privée — l'opération de
      #    Gradle.
      #  • la suivante lisait l'environnement, quand Gradle lisait un
      #    key.properties écrit par le shell, qui déformait `$`, `\` et les
      #    accents graves. Les deux ne voyaient pas le même mot de passe.
      #
      # VerifierCle ouvre le magasin puis la clé, et lit désormais les mêmes
      # variables que Gradle. Rien n'est affiché des mots de passe.
      - name: Éprouver la clé de signature
        if: env.KEYSTORE_B64 != ''
        run: java tool/ci/VerifierCle.java android/autoparc-upload.jks "$ANDROID_KEY_ALIAS"

      - name: Télécharger les dépendances
        run: flutter pub get

      # Les artefacts du SDK, pour les ICONES Material. Roboto, elle, vit
      # dans test/fonts : le SDK ne la livre plus sous Linux, et
      # `precache` n'y change rien — mesure, le dossier material_fonts
      # d'une installation Ubuntu neuve ne contient que les icones.
      # Voir test/support/polices.dart, qui cherche chaque FICHIER dans le
      # depot puis dans le SDK.
      - name: Artefacts du SDK
        run: flutter precache --universal

      # Les avertissements restent non bloquants : le dépôt en porte une
      # vingtaine, antérieurs. Les erreurs, elles, arrêtent le build.
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      # L'URL de production se passe à la compilation. Auparavant une
      # substitution de texte réécrivait endpoints.dart : elle visait `_railway`,
      # renommé `_render` depuis, et ne correspondait donc plus à rien. `sed` ne
      # signale pas une recherche infructueuse — l'APK publié partait avec
      # l'adresse de l'émulateur, sans que rien n'échoue.
      # Le numéro de build (versionCode Android) est celui de l'exécution.
      #
      # Il venait de pubspec.yaml — `version: 1.0.0+1` — et valait donc 1 pour
      # chaque build. Play exige un versionCode strictement croissant d'un envoi
      # à l'autre : le deuxième bundle a été refusé par deux messages qui ne
      # nomment pas le numéro — « cette release ne permet pas d'ajouter ni de
      # supprimer des app bundles » et « aucun utilisateur actuel ne peut
      # effectuer une mise à jour ».
      #
      # `github.run_number` ne fait que croître pour ce workflow : chaque bundle
      # dépasse le précédent sans que personne ait à y penser. Le nom de version
      # affiché (1.0.0) reste celui de pubspec.yaml.
      # `github.run_number` est attache au FICHIER de workflow. Renommer
      # build-apk.yml, ou le supprimer puis le recreer, remet le compteur a 1 —
      # et chaque envoi suivant serait refuse par Play, avec les memes messages
      # qui ne nomment pas le numero. Le fichier plancher enregistre le plus
      # haut versionCode que ce workflow ait jamais produit : rien au dessus
      # n'a pu etre publie, donc le depasser suffit a garantir l'envoi.
      #
      # A relever apres chaque publication acceptee.
      - name: Verifier que le versionCode depasse ce qui est publie
        run: |
          plancher=$(tr -dc '0-9' < android/version_code_plancher.txt)
          code=${{ github.run_number }}
          echo "versionCode de ce build : $code — plancher : $plancher"
          if [ "$code" -le "$plancher" ]; then
            echo "::error::versionCode $code <= plancher $plancher. Play refuserait ce bundle : le compteur d'executions a ete remis a zero (workflow renomme ou recree). Passer --build-number a la main, au dessus du plancher, et relever android/version_code_plancher.txt."
            exit 1
          fi

      - name: Construire l'App Bundle (Play Store)
        run: |
          echo "versionCode de ce build : ${{ github.run_number }}"
          flutter build appbundle --release --no-tree-shake-icons \
            --build-number=${{ github.run_number }} \
            --dart-define=ENABLE_PRIVATE_SALES=true \
            --dart-define=API_BASE_URL=https://autoparc-backend.onrender.com/api

      # L'APK reste utile pour l'installation directe (test terrain, partage
      # WhatsApp) : Play n'accepte que le bundle, mais un bundle ne s'installe
      # pas sur un téléphone.
      - name: Construire l'APK (installation directe)
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --build-number=${{ github.run_number }} \
            --dart-define=ENABLE_PRIVATE_SALES=true \
            --dart-define=API_BASE_URL=https://autoparc-backend.onrender.com/api

      # Le garde-fou qui compte.
      #
      # Sans clé, le build ne échoue pas : il retombe sur la clé de debug et
      # produit un bundle d'apparence normale. Google Play le rejette à l'envoi,
      # après téléversement, avec un message qui ne dit pas d'où vient le
      # problème. On lit donc le certificat ici : le certificat de debug porte
      # toujours « CN=Android Debug », et sa présence arrête le workflow.
      - name: Vérifier que le bundle n'est pas signé en debug
        run: |
          bundle=build/app/outputs/bundle/release/app-release.aab
          echo "Signataire du bundle :"
          keytool -printcert -jarfile "$bundle" | grep -E "Propriétaire|Owner|Valid" || true

          if keytool -printcert -jarfile "$bundle" | grep -q "CN=Android Debug"; then
            echo "::error::Bundle signé avec la clé de DEBUG — Google Play le refusera."
            echo "Renseigner les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,"
            echo "ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD dans les paramètres du dépôt."
            exit 1
          fi

          echo "Signature de publication confirmée."

      # ── Le garde qui lit l'OBJET EXPÉDIÉ, et non le code qui le produit ───
      #
      # Un bundle a déjà été publié sur Play en portant `http://10.0.2.2:8000/api`
      # — l'adresse de l'émulateur Android, non routable depuis un téléphone.
      # L'application installée ne pouvait joindre aucun serveur. Cause : le
      # build avait été lancé sans `--dart-define=API_BASE_URL`, et
      # `endpoints.dart` retombe alors sur l'émulateur.
      #
      # Deux couches existent déjà en amont, et NI L'UNE NI L'AUTRE ne suffit :
      #
      #   — `endpoints.dart` refuse de COMPILER un build `--release` sans
      #     `API_BASE_URL` publiable (un `assert` dans un constructeur `const`,
      #     éprouvé par `test/garde_adresse_release_test.dart`). Mais il accepte
      #     N'IMPORTE QUELLE valeur qui ne soit pas une des trois adresses de
      #     développement : aucun contrôle de schéma ni d'hôte. Une faute de
      #     frappe — `onrender.cm` — compile et part.
      #   — les deux étapes de build ci-dessus passent le define en dur. Mais la
      #     publication du 18/10 a été faite À LA MAIN hors de ce workflow, où
      #     l'adresse est tapée dans la commande. C'est la pratique vivante, et
      #     rien en aval ne relisait ce qu'elle contenait.
      #
      # D'où cette étape : elle n'inspecte ni le code ni la commande, mais les
      # chaînes réellement compilées dans les `libapp.so` des trois ABI. C'est
      # la même famille que le garde de signature juste au-dessus, qui lit le
      # certificat de l'artefact plutôt que les secrets du dépôt.
      #
      # ÉPROUVÉE AVANT D'ÊTRE POSÉE, hors CI, sur cinq cas : les artefacts réels
      # (3 ABI chacun, passent), un `libapp.so` portant l'émulateur, un portant
      # `onrender.cm`, une archive sans `libapp.so`, et un bundle dont UNE SEULE
      # ABI sur trois porte la faute. Les quatre derniers échouent, chacun avec
      # son message.
      #
      # `HOTE_PRODUCTION` est volontairement une troisième écriture de l'hôte,
      # et non une variable injectée dans les `--dart-define` ci-dessus : ces
      # deux lignes doivent rester LITTÉRALES, parce que
      # `garde_adresse_release_test.dart` lit ce fichier et apparie, par
      # expression régulière, le drapeau de define de l'adresse suivi de sa
      # valeur. Un `${{ env.… }}` y capturerait `${{` et ferait tomber la
      # suite, donc le workflow entier — `flutter test` précède les builds. La
      # dérive entre les trois écritures est interdite par ce même banc, qui
      # compare l'hôte ci-dessous à celui des deux defines.
      #
      # CONSÉQUENCE À CONNAÎTRE : ce banc COMPTE les occurrences du drapeau de
      # define de l'adresse, et il en exige exactement deux — celles des deux
      # étapes de build. Il compte aussi celles des COMMENTAIRES et des
      # MESSAGES, qu'il ne sait pas distinguer d'une vraie. En recopier une
      # troisième, même en prose, fait tomber la suite et donc le workflow.
      # C'est arrivé deux fois en écrivant cette étape : d'abord dans le
      # message d'erreur ci-dessous, puis dans ce commentaire même. D'où leurs
      # formulations, qui nomment la variable sans recopier le drapeau.
      - name: Vérifier l'adresse compilée dans les binaires
        env:
          HOTE_PRODUCTION: autoparc-backend.onrender.com
        run: |
          set -euo pipefail

          verifier() {
            artefact="$1"
            motif="$2"
            etiquette="$3"

            if [ ! -f "$artefact" ]; then
              echo "::error::$etiquette : artefact introuvable ($artefact)."
              exit 1
            fi

            atelier="$(mktemp -d)"
            # `unzip` sort en 11 quand le motif ne correspond à rien : on laisse
            # passer pour rendre un message qui nomme la cause, au lieu d'un
            # code nu.
            unzip -o -q "$artefact" "$motif" -d "$atelier" || true

            libs="$(find "$atelier" -name 'libapp.so')"
            if [ -z "$libs" ]; then
              echo "::error::$etiquette : aucun libapp.so extrait avec le motif « $motif »."
              echo "Le format de l'artefact a changé : corriger le motif, ne pas retirer ce garde."
              exit 1
            fi

            nombre=0
            for so in $libs; do
              nombre=$((nombre + 1))
              court="${so#"$atelier"/}"

              if grep -aq '10\.0\.2\.2' "$so"; then
                echo "::error::$etiquette : $court porte l'adresse de l'émulateur (10.0.2.2)."
                echo "Ce binaire ne peut joindre aucun serveur depuis un téléphone."
                echo "Relancer le build en passant API_BASE_URL=https://$HOTE_PRODUCTION/api en dart-define."
                exit 1
              fi

              if ! grep -aq "$HOTE_PRODUCTION" "$so"; then
                echo "::error::$etiquette : $court ne porte pas $HOTE_PRODUCTION."
                echo "L'adresse compilée n'est pas celle de la production : vérifier --dart-define=API_BASE_URL."
                exit 1
              fi
            done

            echo "$etiquette : $nombre bibliothèque(s), toutes sur $HOTE_PRODUCTION, aucune sur l'émulateur."
          }

          verifier build/app/outputs/bundle/release/app-release.aab 'base/lib/*/libapp.so' 'App Bundle'
          verifier build/app/outputs/flutter-apk/app-release.apk 'lib/*/libapp.so' 'APK'

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: autoparc-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
