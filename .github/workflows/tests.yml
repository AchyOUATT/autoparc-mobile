name: Tests

# Sur chaque poussée et chaque pull request. Le workflow « Build APK » ne
# vérifie que la compilation : un modèle qui ne sait plus lire la réponse de
# l'API compile parfaitement et casse le catalogue au premier lancement.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # La version se lit dans pubspec.yaml, sous `environment: flutter:`.
      #
      # Elle était écrite ici, et dans « Build Android ». Mettre l'une à jour
      # sans l'autre a laissé ce workflow sur Flutter 3.32, qui livre Dart 3.8
      # quand le projet en exige 3.11 : `flutter pub get` échouait, et les
      # tests ne tournaient plus du tout. Personne ne s'en apercevait — un
      # workflow rouge ne se voit que si on le regarde.
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Version retenue
        run: flutter --version

      - name: Télécharger les dépendances
        run: flutter pub get

      # Les avertissements existants sont nombreux ; on ne bloque que sur les
      # erreurs, sans quoi le garde-fou serait désactivé dès le premier jour.
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Lancer les tests
        run: flutter test
