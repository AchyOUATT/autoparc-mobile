name: Tests

# Sur chaque poussée et chaque pull request. Le workflow « Build APK » ne
# vérifie que la compilation : un modèle qui ne sait plus lire la réponse de
# l'API compile parfaitement et casse le catalogue au premier lancement.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Doit rester égale à celle de « Build Android », et au moins égale à la
      # contrainte `environment: flutter:` de pubspec.yaml.
      #
      # Les deux workflows ont déjà divergé : celui-ci est resté sur Flutter
      # 3.32, qui livre Dart 3.8 quand le projet en exige 3.11. `flutter pub
      # get` échouait, l'analyse et les tests étaient sautés, et le workflow
      # s'arrêtait avant d'avoir rien vérifié — pendant huit poussées.
      #
      # `flutter-version-file: pubspec.yaml` avait l'air d'être la réponse :
      # une seule source. L'action ne sait pas résoudre une plage comme
      # « >=3.47.2 » et échoue à l'installation. C'est donc la contrainte dans
      # pubspec qui sert de garde-fou : sur une version trop ancienne, `pub
      # get` refuse en nommant la version attendue, au lieu de laisser sortir
      # une erreur de SDK Dart sans rapport apparent.
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Version retenue
        run: flutter --version

      - name: Télécharger les dépendances
        run: flutter pub get

      # Les avertissements existants sont nombreux ; on ne bloque que sur les
      # erreurs, sans quoi le garde-fou serait désactivé dès le premier jour.
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Lancer les tests
        run: flutter test
